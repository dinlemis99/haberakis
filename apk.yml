name: APK derle

# Elle calistirilir: Actions -> "APK derle" -> Run workflow.
# Sonunda Releases sayfasina HaberAkis.apk yuklenir.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Proje klasorunu hazirla
        run: |
          mkdir -p apk/www
          cp apk-package.json apk/package.json
          cp apk-capacitor.config.json apk/capacitor.config.json
          cp index.html apk/www/index.html
          cp apk-native.js apk/www/native.js
          sed -i 's#</head>#<script src="native.js"></script></head>#' apk/www/index.html
          grep -c 'native.js' apk/www/index.html
      - name: Android projesini olustur
        working-directory: apk
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Simgeler ve surum numarasi
        run: |
          pip install pillow
          python apk-icons.py apk/android/app/src/main/res
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" apk/android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.${{ github.run_number }}"/' apk/android/app/build.gradle
      - name: Imza anahtari
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
      - name: APK derle
        working-directory: apk/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Releases sayfasina yukle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/android/app/build/outputs/apk/debug/app-debug.apk HaberAkis.apk
          gh release delete apk-son --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create apk-son HaberAkis.apk --repo "${{ github.repository }}" --title "HaberAkis APK" --notes "Telefona indirip kurun. Surum: 1.${{ github.run_number }}"
